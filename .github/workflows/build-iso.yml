
name: Build AdapterOS XP ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools

      - name: Check available disk space
        run: df -h /

      - name: Configure ISO
        working-directory: AdapterOS-XP-Phase1-Starter-v2/AdapterOS-XP-Phase1
        run: sudo bash scripts/configure-iso.sh

      - name: Build ISO
        working-directory: AdapterOS-XP-Phase1-Starter-v2/AdapterOS-XP-Phase1
        run: sudo bash scripts/build-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: AdapterOS-XP-ISO
          path: AdapterOS-XP-Phase1-Starter-v2/AdapterOS-XP-Phase1/live-image-amd64.hybrid.iso
          if-no-files-found: error
          retention-days: 14
