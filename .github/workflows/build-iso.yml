
name: Build AdapterOS XP ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-iso:
    name: Build AdapterOS XP
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Install build dependencies
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            curl \
            unzip \
            cpio \
            debootstrap \
            gettext-base \
            gawk \
            file \
            rsync \
            squashfs-tools \
            xorriso \
            grub-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            isolinux \
            syslinux-common \
            syslinux-utils \
            apt-utils

          # Download Debian Trixie's live-build package.
          LIVE_BUILD_DEB="$RUNNER_TEMP/live-build.deb"

          curl -fL \
            "https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb" \
            -o "$LIVE_BUILD_DEB"

          # Verify live-build package.
          echo "58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4  $LIVE_BUILD_DEB" \
            | sha256sum --check -

          sudo dpkg -i "$LIVE_BUILD_DEB"

          echo "Installed live-build:"
          lb --version

      # 3. Install the official Debian archive keyring
      - name: Install Debian Trixie archive keyring
        shell: bash
        run: |
          set -euo pipefail

          KEYRING_DEB="$RUNNER_TEMP/debian-archive-keyring.deb"
          KEYRING_DIR="$RUNNER_TEMP/debian-keyring-extracted"

          echo "Downloading Debian archive keyring 2025.1..."

          curl -fL \
            "https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb" \
            -o "$KEYRING_DEB"

          # Verify against Debian's published SHA-256.
          echo "9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac  $KEYRING_DEB" \
            | sha256sum --check -

          # Extract without installing Debian packages into Ubuntu.
          mkdir -p "$KEYRING_DIR"

          dpkg-deb -x "$KEYRING_DEB" "$KEYRING_DIR"

          KEYRING_SOURCE="$KEYRING_DIR/usr/share/keyrings/debian-archive-keyring.gpg"

          if [[ ! -s "$KEYRING_SOURCE" ]]; then
            echo "ERROR: Debian archive keyring was not extracted."
            exit 1
          fi

          # Install the keyring where debootstrap expects it.
          sudo install -D -m 0644 \
            "$KEYRING_SOURCE" \
            /usr/share/keyrings/debian-archive-keyring.gpg

          echo "Checking installed keyring..."

          ls -lh /usr/share/keyrings/debian-archive-keyring.gpg

          test -s /usr/share/keyrings/debian-archive-keyring.gpg

          echo "Debian archive keyring installed successfully."

      # 4. Locate AdapterOS XP
      - name: Locate AdapterOS XP project
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_ROOT="$GITHUB_WORKSPACE"

          echo "Searching for AdapterOS XP..."

          SCRIPT_PATH="$(
            find "$SEARCH_ROOT" \
              -type f \
              -path '*/scripts/configure-iso.sh' \
              -not -path '*/.git/*' \
              -print -quit
          )"

          # Search ZIP archives if necessary.
          if [[ -z "$SCRIPT_PATH" ]]; then
            echo "Searching ZIP archives..."

            mkdir -p "$RUNNER_TEMP/adapteros-extracted"

            while IFS= read -r -d '' ZIP_FILE; do
              DEST="$RUNNER_TEMP/adapteros-extracted/$(basename "$ZIP_FILE" .zip)"

              mkdir -p "$DEST"
              unzip -oq "$ZIP_FILE" -d "$DEST"

              SCRIPT_PATH="$(
                find "$DEST" \
                  -type f \
                  -path '*/scripts/configure-iso.sh' \
                  -print -quit
              )"

              if [[ -n "$SCRIPT_PATH" ]]; then
                break
              fi

            done < <(
              find "$SEARCH_ROOT" \
                -maxdepth 5 \
                -type f \
                -iname '*.zip' \
                -print0
            )
          fi

          if [[ -z "$SCRIPT_PATH" ]]; then
            echo "ERROR: Cannot find scripts/configure-iso.sh"
            find "$SEARCH_ROOT" -maxdepth 6 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$SCRIPT_PATH")")"

          echo "Found project: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Check project files
      - name: Check AdapterOS XP files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          REQUIRED_FILES=(
            "scripts/configure-iso.sh"
            "scripts/build-iso.sh"
            "scripts/clean-iso.sh"
            "config/package-lists/adapteros-xp.list.chroot"
            "ade/CMakeLists.txt"
            "ade/src/main.cpp"
            "ade/qml/Main.qml"
          )

          echo "Checking AdapterOS XP files..."

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "ERROR: Missing file: $FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo "All required files found."

      # 6. Set script permissions
      - name: Set script permissions
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          chmod +x scripts/configure-iso.sh
          chmod +x scripts/build-iso.sh
          chmod +x scripts/clean-iso.sh

      # 7. Configure ISO
      - name: Configure AdapterOS XP
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          bash scripts/configure-iso.sh

      # 8. Build ISO
      - name: Build AdapterOS XP ISO
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Checking available disk space:"
          df -h .

          echo "Checking Debian keyring:"
          test -s /usr/share/keyrings/debian-archive-keyring.gpg

          echo "Starting AdapterOS XP ISO build..."

          set -o pipefail
          bash scripts/build-iso.sh 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      # 9. Verify ISO
      - name: Verify generated ISO
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist"

          mapfile -d '' ISO_FILES < <(
            sudo find "$PROJECT_DIR" \
              -maxdepth 4 \
              -type f \
              -iname '*.iso' \
              -print0
          )

          if [[ "${#ISO_FILES[@]}" -eq 0 ]]; then
            echo "ERROR: No ISO file was generated."
            exit 1
          fi

          for ISO in "${ISO_FILES[@]}"; do
            echo "Found ISO: $ISO"

            sudo cp "$ISO" "$GITHUB_WORKSPACE/dist/"
            sudo chown "$(id -u):$(id -g)" \
              "$GITHUB_WORKSPACE/dist/$(basename "$ISO")"
          done

          echo "Generated ISO files:"
          ls -lh "$GITHUB_WORKSPACE/dist/"

      # 10. Upload ISO
      - name: Upload AdapterOS XP ISO
        uses: actions/upload-artifact@v7
        with:
          name: AdapterOS-XP-0.1-amd64
          path: dist/*.iso
          if-no-files-found: error
          retention-days: 14

      # 11. Upload build log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AdapterOS-XP-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
