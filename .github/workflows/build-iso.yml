
name: Build AdapterOS XP ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-iso:
    name: Build AdapterOS XP
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:
      # 1. Download the repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install build dependencies
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            unzip \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            isolinux \
            syslinux-common \
            syslinux-utils

      # 3. Automatically locate the project
      - name: Locate AdapterOS XP project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching repository for AdapterOS XP..."

          SEARCH_ROOT="$GITHUB_WORKSPACE"

          # First, look for the configuration script directly.
          SCRIPT_PATH="$(
            find "$SEARCH_ROOT" \
              -type f \
              -path '*/scripts/configure-iso.sh' \
              -not -path '*/.git/*' \
              -print -quit
          )"

          # If the script is not found, look inside ZIP archives.
          if [[ -z "$SCRIPT_PATH" ]]; then
            echo "Script not found in extracted folders."
            echo "Searching ZIP archives..."

            mkdir -p "$RUNNER_TEMP/adapteros-extracted"

            while IFS= read -r -d '' ZIP_FILE; do
              echo "Extracting: $ZIP_FILE"

              DEST="$RUNNER_TEMP/adapteros-extracted/$(basename "$ZIP_FILE" .zip)"
              mkdir -p "$DEST"

              unzip -oq "$ZIP_FILE" -d "$DEST"

              SCRIPT_PATH="$(
                find "$DEST" \
                  -type f \
                  -path '*/scripts/configure-iso.sh' \
                  -print -quit
              )"

              if [[ -n "$SCRIPT_PATH" ]]; then
                break
              fi
            done < <(
              find "$SEARCH_ROOT" \
                -maxdepth 4 \
                -type f \
                -name '*.zip' \
                -print0
            )
          fi

          # Stop if the project could not be found.
          if [[ -z "$SCRIPT_PATH" ]]; then
            echo "ERROR: Could not find scripts/configure-iso.sh."
            echo "Repository directory structure:"
            find "$SEARCH_ROOT" -maxdepth 6 -print
            exit 1
          fi

          # Determine the actual project root.
          PROJECT_DIR="$(dirname "$(dirname "$SCRIPT_PATH")")"

          echo "Found AdapterOS XP!"
          echo "Project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. Verify project files
      - name: Check AdapterOS XP files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          REQUIRED_FILES=(
            "scripts/configure-iso.sh"
            "scripts/build-iso.sh"
            "scripts/clean-iso.sh"
            "config/package-lists/adapteros-xp.list.chroot"
            "ade/CMakeLists.txt"
            "ade/src/main.cpp"
            "ade/qml/Main.qml"
          )

          echo "Checking AdapterOS XP files..."

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "ERROR: Missing file: $FILE"
              exit 1
            fi

            echo "FOUND: $FILE"
          done

          echo "All required files found!"

      # 5. Set permissions
      - name: Set script permissions
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          chmod +x scripts/configure-iso.sh
          chmod +x scripts/build-iso.sh
          chmod +x scripts/clean-iso.sh

      # 6. Configure ISO
      - name: Configure AdapterOS XP
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          bash scripts/configure-iso.sh

      # 7. Build ISO
      - name: Build AdapterOS XP
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          bash scripts/build-iso.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # 8. Verify and collect ISO
      - name: Verify generated ISO
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist"

          mapfile -d '' ISO_FILES < <(
            find "$PROJECT_DIR" \
              -maxdepth 4 \
              -type f \
              -iname '*.iso' \
              -print0
          )

          if [[ "${#ISO_FILES[@]}" -eq 0 ]]; then
            echo "ERROR: No ISO file was generated."
            exit 1
          fi

          for ISO in "${ISO_FILES[@]}"; do
            echo "Found ISO: $ISO"
            cp "$ISO" "$GITHUB_WORKSPACE/dist/"
          done

          echo "Generated ISO files:"
          ls -lh "$GITHUB_WORKSPACE/dist/"

      # 9. Upload ISO
      - name: Upload AdapterOS XP ISO
        uses: actions/upload-artifact@v6
        with:
          name: AdapterOS-XP-0.1-amd64
          path: dist/*.iso
          if-no-files-found: error
          retention-days: 14

      # 10. Upload build log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AdapterOS-XP-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
