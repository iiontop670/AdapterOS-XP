
name: Build AdapterOS XP ISO

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-iso:
    name: Build AdapterOS XP
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    defaults:
      run:
        working-directory: AdapterOS-XP-Phase1-Starter-v2

    steps:
      # 1. Download the repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Verify project folder
      - name: Check project folder
        working-directory: .
        shell: bash
        run: |
          echo "Repository root:"
          pwd
          ls -la

          if [ ! -d "AdapterOS-XP-Phase1-Starter-v2" ]; then
            echo "ERROR: Project folder not found!"
            exit 1
          fi

          echo "AdapterOS XP project folder found."

      # 3. Install build dependencies
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            isolinux \
            syslinux-common \
            syslinux-utils

      # 4. Check required project files
      - name: Check repository structure
        shell: bash
        run: |
          echo "Checking AdapterOS XP files..."

          REQUIRED_FILES=(
            "scripts/configure-iso.sh"
            "scripts/build-iso.sh"
            "scripts/clean-iso.sh"
            "config/package-lists/adapteros-xp.list.chroot"
            "ade/CMakeLists.txt"
            "ade/src/main.cpp"
            "ade/qml/Main.qml"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing file: $FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo "All required files found."

      # 5. Make scripts executable
      - name: Set script permissions
        shell: bash
        run: |
          chmod +x scripts/configure-iso.sh
          chmod +x scripts/build-iso.sh
          chmod +x scripts/clean-iso.sh

      # 6. Configure ISO
      - name: Configure AdapterOS XP
        shell: bash
        run: |
          bash scripts/configure-iso.sh

      # 7. Build ISO
      - name: Build AdapterOS XP ISO
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-iso.sh 2>&1 | tee build.log

      # 8. Verify ISO
      - name: Verify generated ISO
        shell: bash
        run: |
          mapfile -t ISO_FILES < <(
            find . -maxdepth 1 -type f -name "*.iso" -print
          )

          if [ "${#ISO_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ISO file was generated."
            exit 1
          fi

          echo "ISO generated successfully:"
          ls -lh "${ISO_FILES[@]}"

      # 9. Upload ISO
      - name: Upload AdapterOS XP ISO
        uses: actions/upload-artifact@v6
        with:
          name: AdapterOS-XP-0.1-amd64
          path: AdapterOS-XP-Phase1-Starter-v2/*.iso
          if-no-files-found: error
          retention-days: 14

      # 10. Upload build log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AdapterOS-XP-build-log
          path: AdapterOS-XP-Phase1-Starter-v2/build.log
          if-no-files-found: ignore
          retention-days: 7
